            'гидропломба кальмастоп': '/kalmatron_uz/catalog/remontnye-smesi/gidroplomba-kalmastop/',
            'кальматрон-шовный': '/kalmatron_uz/catalog/remontnye-smesi/kalmatron-shovnyy/',
            'гидробетон срг-ф1': '/kalmatron_uz/catalog/remontnye-smesi/gidrobeton-srg-f1/',

            'гидробетон срг-1': '/kalmatron_uz/catalog/remontnye-smesi/gidrobeton-srg-1/',

            'гидробетон крио-2': '/kalmatron_uz/catalog/remontnye-smesi/gidrobeton-krio-2/',
            'гидробетон-подводный': '/kalmatron_uz/catalog/remontnye-smesi/gidrobeton-podvodnyy-pm/',
            'гидробетон св-1': '/kalmatron_uz/catalog/remontnye-smesi/gidrobeton-sv-1/',

            'бентонитовый шнур ультраплат': '/kalmatron_uz/catalog/sistemy-gidroizolyatsii-shvov/bentonitovyy-shnur-ultraplat/',
            'гидрошпонки ультрабанд': '/kalmatron_uz/catalog/sistemy-gidroizolyatsii-shvov/gidroshponki-ultraband/',
            'инжектосистема кальматрон': '/kalmatron_uz/catalog/sistemy-gidroizolyatsii-shvov/inzhektosistema-kalmatron/',
            'эластичная лента ультрабанд': '/kalmatron_uz/catalog/sistemy-gidroizolyatsii-shvov/elastichnaya-lenta-ultraband-defshov/',
            'клей ультрабанд': '/kalmatron_uz/catalog/sistemy-gidroizolyatsii-shvov/kley-ultraband-defshov/',
            'топпинг ультратоп кварц': '/kalmatron_uz/catalog/topping/topping-ultratop-kvarts/',
            'проникающая гидроизоляция': '/kalmatron_uz/catalog/pronikayushchaya-gidroizolyatsiya/',
            'эластичная гидроизоляция': '/kalmatron_uz/catalog/elastichnaya-gidroizolyatsiya/',
            'добавки в бетон': '/kalmatron_uz/catalog/dobavki-v-beton/',
            'грунтовка для бетона': '/kalmatron_uz/catalog/gruntovka-dlya-betona/',
            'инъекционная гидроизоляция': '/kalmatron_uz/catalog/inektsionnaya-otsechnaya-gidroizolyatsiya/',
            'ремонтные смеси': '/kalmatron_uz/catalog/remontnye-smesi/',
            'системы гидроизоляции': '/kalmatron_uz/catalog/sistemy-gidroizolyatsii-shvov/',
            'топпинг': '/kalmatron_uz/catalog/topping/',
            'упрочнитель бетона': '/kalmatron_uz/catalog/uprochnitel-betona/'
        };

        function performSearch() {
  const params = new URLSearchParams(location.search);
  const query = params.get('q');

  if (!query) {
    location.href = 'catalog/index.html';
    return;
  }

  const search = query.toLowerCase().trim();

  // 1. точное совпадение
  if (products[search]) {
    location.href = products[search];
    return;
  }

  // 2. частичное совпадение
  for (const key in products) {
    if (key.includes(search)) {
      location.href = products[key];
      return;
    }
  }

  // 3. fallback
  location.href = 'catalog/index.html';
}

window.addEventListener('load', performSearch);
</script>
</head>
<body>

</body>
</html>
